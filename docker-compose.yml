
services:
  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    networks:
      - default

  db-test:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=astrodle_test
      - POSTGRES_PASSWORD=astrodle_test
      - POSTGRES_DB=astrodle_test
    container_name: postgres-test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '5433:5432'
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: astrodle-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: astrodle-dev-key
      MINIO_ROOT_PASSWORD: astrodle-dev-secret-key
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: astrodle-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 astrodle-dev-key astrodle-dev-secret-key;
      mc mb --ignore-existing local/astrodle;
      mc anonymous set download local/astrodle/users;
      mc anonymous set download local/astrodle/space-organisations;
      mc anonymous set download local/astrodle/personalities;
      mc anonymous set download local/astrodle/space-sky-objects;
      mc anonymous set download local/astrodle/telescopes;
      exit 0;
      "
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-docker-postgres
    ports:
      - '3001:3000'
    depends_on:
      - db
    env_file: .env
    networks:
      - default
    command: npm run start:dev

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: nest-pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '5050:80'
    depends_on:
      - db
    networks:
      - default

volumes:
  pgdata:
  minio_data:


networks:
  default: